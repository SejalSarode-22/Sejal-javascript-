<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial;
        }

        input, textarea {
            padding: 5px;
            margin-top: 5px;
        }

        .valid {
            border: 2px solid green;
        }

        .invalid {
            border: 2px solid red;
        }

        small {
            color: red;
        }
    </style>

</head>
<body>

    <h2>Registration Form</h2>

    <form id="form">

        <label>Full Name:</label><br>
        <input type="text" id="name">
        <small id="nameError"></small><br><br>

        <label>Email:</label><br>
        <input type="email" id="email">
        <small id="emailError"></small><br><br>

        <label>Phone:</label><br>
        <input type="text" id="phone">
        <small id="phoneError"></small><br><br>

        <label>Password:</label><br>
        <input type="password" id="password">
        <small id="passwordError"></small><br><br>

        <label>About Yourself:</label><br>
        <textarea id="bio" rows="4" cols="30" maxlength="200"></textarea><br>
        <small id="charCount">0 / 200 characters</small><br><br>

        <button type="submit">Register</button>

    </form>

    <script>
        let form = document.getElementById("form");
        let bio = document.getElementById("bio");
        let charCount = document.getElementById("charCount");

        // Character Counter
        bio.addEventListener("input", function() {
            let currentLength = bio.value.length;
            charCount.textContent = currentLength + " / 200 characters";
        });

        // Form Validation
        form.addEventListener("submit", function(e){
            e.preventDefault();

            let isValid = true;

            let nameInput = document.getElementById("name");
            let emailInput = document.getElementById("email");
            let phoneInput = document.getElementById("phone");
            let passwordInput = document.getElementById("password");

            let name = nameInput.value.trim();
            let email = emailInput.value.trim();
            let phone = phoneInput.value.trim();
            let password = passwordInput.value.trim();

            let nameError = document.getElementById("nameError");
            let emailError = document.getElementById("emailError");
            let phoneError = document.getElementById("phoneError");
            let passwordError = document.getElementById("passwordError");

            // Clear old
            nameError.textContent = "";
            emailError.textContent = "";
            phoneError.textContent = "";
            passwordError.textContent = "";

            nameInput.className = "";
            emailInput.className = "";
            phoneInput.className = "";
            passwordInput.className = "";

            // Name
            if (name === "") {
                nameError.textContent = "Enter your name";
                nameInput.className = "invalid";
                isValid = false;
            } else {
                nameInput.className = "valid";
            }

            // Email
            if (!email.includes("@")) {
                emailError.textContent = "Enter valid email";
                emailInput.className = "invalid";
                isValid = false;
            } else {
                emailInput.className = "valid";
            }

            // Phone
            if (phone.length !== 10) {
                phoneError.textContent = "Enter 10 digit number";
                phoneInput.className = "invalid";
                isValid = false;
            } else {
                phoneInput.className = "valid";
            }

            // Password
            if (password.length < 6) {
                passwordError.textContent = "Minimum 6 characters";
                passwordInput.className = "invalid";
                isValid = false;
            } else {
                passwordInput.className = "valid";
            }

            // Final
            if (isValid) {
                alert("Registration Successful");
                form.reset();
                charCount.textContent = "0 / 200 characters";

                nameInput.className = "";
                emailInput.className = "";
                phoneInput.className = "";
                passwordInput.className = "";
            }
        });
    </script>

</body>
</html>
