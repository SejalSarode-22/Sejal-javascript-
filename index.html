<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <h2>Registration Form</h2>

    <form id="form">

        <label>Full Name:</label><br>
        <input type="text" id="name"><br><br>

        <label>Email:</label><br>
        <input type="email" id="email"><br><br>

        <label>Phone:</label><br>
        <input type="text" id="phone"><br><br>

        <label>Password:</label><br>
        <input type="password" id="password"><br><br>

        <label>About Yourself:</label><br>
        <textarea id="bio" rows="4" cols="30" maxlength="200"></textarea><br>
        <small id="charCount">0 / 200 characters</small><br><br>

        <button type="submit">Register</button>

    </form>

    <script>
        const form = document.getElementById("form");
        const bio = document.getElementById("bio");
        const charCount = document.getElementById("charCount");

        // Character Counter
        bio.addEventListener("input", function() {
            const currentLength = bio.value.length;
            charCount.textContent = currentLength + " / 200 characters";
        });

        // Form submit
        form.addEventListener("submit", function(e){
            e.preventDefault();
            alert("Form Submitted");
        });
    </script>

</body>
</html>
